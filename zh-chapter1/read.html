<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ecdd">
<title>我愛中國｜柏宸中文繪本</title>
<link rel="stylesheet" href="reader/book.css">
<script defer src="reader/hanzi-writer.min.js"></script>
<script defer src="reader/book-data.js"></script>
<script defer src="reader/ink.js"></script>
<script defer src="reader/book.js"></script>
</head>
<body>
<div class="shell">
  <header class="toolbar">
    <a id="shelf" class="tool" href="../chinese-books.html" aria-label="返回中文書架" title="返回中文書架">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.8 10v10h12.4V10M10 20v-6h4v6"/></svg>
    </a>
    <button class="tool" id="contentsOpen" type="button" aria-label="目錄" title="目錄">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 7h1m4 0h9M5 12h1m4 0h9M5 17h1m4 0h9"/></svg>
    </button>
  </header>
  <main id="stage" aria-label="繪本"></main>
  <footer class="controls" aria-label="閱讀控制">
    <button type="button" class="tool" id="previous" aria-label="上一頁"><i class="arrow left"></i></button>
    <div class="central">
      <button type="button" class="sound" id="sound" aria-label="播放本頁">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path class="play-mark" d="m9 5 11 7-11 7Z"/><path class="stop-mark" d="M9 7v10m6-10v10"/></svg>
        <span id="soundLabel">聽故事</span>
      </button>
      <span class="sr-only" id="pageNumber"></span>
    </div>
    <button type="button" class="tool" id="next" aria-label="下一頁"><i class="arrow"></i></button>
  </footer>
</div>
<dialog id="contents" aria-labelledby="contentsTitle">
  <header><h2 id="contentsTitle" class="sr-only">目錄</h2><form method="dialog"><button type="submit" class="tool" aria-label="關閉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></form></header>
  <nav id="chapters"></nav>
</dialog>
<div id="audioStatus" class="sr-only" role="status"></div>
</body>
</html>
