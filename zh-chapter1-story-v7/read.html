  <main class="reader" id="reader" aria-label="《我愛中國》中文有聲繪本">
    <h1 class="sr-only">我愛中國</h1>
    <div class="book-shell" id="bookShell" aria-busy="true">
      <div class="boot-cover" id="bootCover"><img src="pages/p00.webp" alt="我愛中國" width="1448" height="1086" draggable="false"></div>
      <div class="flipbook" id="flipbook" role="img" aria-label="整頁有聲繪本"></div>
      <div class="book-tap" id="pageStage" role="region" tabindex="-1" aria-label="向左或向右掃動翻頁" aria-describedby="bookInstructions"></div>
      <p class="sr-only" id="bookInstructions">向左掃去下一頁，向右掃返回。可在選單選手動或自動翻頁。</p>
      <div id="zhActivity"></div><div class="book-controls" role="group" aria-label="故事控制"><a class="book-control shelf-control" id="libraryLink" href="../chinese-books.html" aria-label="返回中文書架"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-shelf-home"></use></svg></a><button class="book-control menu-control" id="menuButton" aria-label="打開選單" aria-haspopup="dialog"><svg class="icon"><use href="#i-menu"></use></svg></button>

      </div><button class="next-page-hint" id="nextPageButton" aria-label="閱讀下一頁" hidden=""><span>下一頁</span><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"></path></svg></button>
      <span class="sr-only" id="bookStatus" role="status" aria-live="polite">正在打開繪本。</span>
    </div>

    <dialog class="book-panel" id="bookDialog" aria-labelledby="panelTitle">
      <header class="panel-heading">
        <button class="icon-button" id="panelBack" aria-label="返回選單" hidden=""><svg class="icon"><use href="#i-back"></use></svg></button>
        <h2 id="panelTitle">故事選單</h2>
        <button class="icon-button" id="panelClose" aria-label="關閉選單"><svg class="icon"><use href="#i-close"></use></svg></button>
      </header>
      <div class="panel-body" id="panelBody">
        <section data-menu-view="main">
          <p class="menu-intro">每頁由頭朗讀。向左掃動去下一頁，向右掃動返回。</p>
          <p class="menu-status" id="menuStatus" role="status" hidden=""></p>
          <fieldset class="reading-modes" role="radiogroup" aria-labelledby="readingModeLegend" aria-describedby="readingModeDescription">
  <legend id="readingModeLegend">閱讀模式</legend>
  <button id="readingModeManual" type="button" value="manual" role="radio" aria-checked="true"><span class="mode-dot" aria-hidden="true"></span><span><strong>手動翻頁</strong><small>聽完呢頁等你翻。</small></span></button>
  <button id="readingModeAuto" type="button" value="auto" role="radio" aria-checked="false"><span class="mode-dot" aria-hidden="true"></span><span><strong>自動翻頁</strong><small>故事讀完會翻頁，問答頁會停低。</small></span></button>
  <p id="readingModeDescription">準備好就可以翻頁。</p>
</fieldset>
          <nav class="menu-actions" aria-label="故事功能">
            <button id="contentsButton"><svg class="icon"><use href="#i-book"></use></svg><span>揀一頁</span></button>
            <button id="transcriptButton"><svg class="icon"><use href="#i-text"></use></svg><span>睇返講稿</span></button>

            <button id="settingsButton"><svg class="icon"><use href="#i-settings"></use></svg><span>旁白音量</span></button>
          </nav>
          <details class="small-detail credits"><summary>製作資料</summary><p id="creditsText">柏宸中文有聲繪本。粵語配音使用 <a href="https://elevenlabs.io/" rel="noopener">ElevenLabs.io</a> 的 Bella 聲線。</p><p>翻頁效果使用 <span>StPageFlip · MIT 授權</span>.</p></details>

          <button class="text-button" id="reloadButton" hidden="">重新載入繪本</button>
        <p id="offlineStatus" class="offline-status" role="status">離線儲存由書架管理。</p></section>
        <section data-menu-view="contents" hidden=""><div class="page-grid" id="pageGrid"></div></section>
        <section data-menu-view="transcript" hidden=""><h3 class="transcript-title" id="transcriptTitle"></h3><div id="transcriptContent" lang="zh-HK"></div></section>
        <section data-menu-view="settings" hidden="">
          <label class="range-setting"><span>旁白音量</span><input id="masterVolume" type="range" min="0" max="1" step="0.05" value="0.9"></label>


        </section>
      </div>
    </dialog>
