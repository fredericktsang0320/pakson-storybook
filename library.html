<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8ec">
  <meta name="description" content="Pakson 的小書房：挑一本喜歡的書，一起讀故事。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pakson 的小書房">
  <title>Pakson 的小書房</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/icons/book.svg" type="image/svg+xml">
  <link rel="stylesheet" href="library.css">
  <script src="library.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#books">跳到圖書</a>
  <div class="library-shell">
    <header class="library-header">
      <a class="brand" href="./library.html" aria-label="Pakson 的小書房首頁"><span class="brand-mark" aria-hidden="true">P</span><span>Pakson 的小書房</span></a>
      <span class="header-note">一起讀故事</span>
    </header>
    <main>
      <section class="welcome" aria-labelledby="welcomeTitle">
        <div class="welcome-copy"><p class="hello">你好，Pakson！</p><h1 id="welcomeTitle">今天讀哪一本？</h1><p class="intro">選一本喜歡的書，開始小冒險。</p></div>
        <img class="welcome-pakson" src="assets/pages/page_13.png" alt="開懷大笑的 Pakson" width="1448" height="1086" decoding="async">
      </section>
      <nav class="subject-filters" id="subjectFilters" aria-label="按科目選書"><button class="subject-button is-selected" type="button" data-subject="all" aria-pressed="true">全部</button><button class="subject-button" type="button" data-subject="english" aria-pressed="false">英文</button><button class="subject-button" type="button" data-subject="chinese" aria-pressed="false">中文</button></nav>
      <section class="books-section" id="books" aria-labelledby="shelfTitle" tabindex="-1">
        <h2 id="shelfTitle" class="shelf-title">我的小書架</h2>
        <p class="library-status" id="libraryStatus" role="status" aria-live="polite">正在打開小書房……</p>
        <div class="book-grid" id="bookGrid" aria-busy="true"></div>
        <div class="empty-state" id="emptyState" hidden><span class="empty-book" aria-hidden="true"></span><h3 id="emptyTitle">中文讀物準備中</h3><p>先到英文書架，跟 Pakson 讀故事吧。</p><button class="text-button" id="showEnglish" type="button">看看英文讀物</button></div>
        <div class="error-state" id="errorState" hidden><h3>小書架暫時打不開</h3><p>請檢查網絡，再試一次。</p><button class="text-button" id="retryButton" type="button">再試一次</button><a class="fallback-link" href="./index.html">直接閱讀 Thank you!</a></div>
        <noscript><p>請開啟 JavaScript 以選擇科目，或<a href="./index.html">直接閱讀 Thank you!</a>。</p></noscript>
      </section>
    </main>
    <footer class="library-footer">一本小書，一段好時光。</footer>
  </div>
</body>
</html>
